# THE MANIFEST — every verbatim section above, with the sha256 of its text and
# its length. This is what makes the document checkable rather than merely
# readable: the ingest recomputes each digest from the text it parsed, and a
# section edited in transit is a refusal rather than a surprise later. Digests
# are over the NORMALISED text (LF line endings, no trailing whitespace, one
# final newline), which is exactly what is written below.
sections:
  - name: profile
    sha256: '8f4f3c7e943a34b65ae6eacd095da8abd65d35dfd7983fbd90d34b1c87859330'
    lines: 15
  - name: values
    sha256: '0e99ad5cec48ad0fa880bb11b5b4c545ffed0a13fd6ea0b70828e2669dcb4a54'
    lines: 32
  - name: contract_document
    sha256: '94abcbb29d0ded329d7a91ed458b4558ee8e8a591c49f3a0e596f8b8eef5234d'
    lines: 61
  - name: preflight_receipt
    sha256: '076ddb512fcc495f7d8dabbbb0f69fca402c2c843015b5f174b8d90456342377'
    lines: 18
  - name: smoke_receipt
    sha256: '3cd84e3e1d4369e742b027f9502062298c4fc5352e90589a49b227e55e086072'
    lines: 19


# WHAT IS NOT HERE, AND WHY. Recorded rather than defaulted to an empty
# string: a receipt that is blank because nothing ran and a receipt that is
# blank because a phase produced nothing look identical, and only one of them
# is fine. An empty list here means every section was produced.
absent:
  - what: install_log
    reason: >-
      install was not requested (--install); nothing ran, so there is no log
      rather than an empty one
  - what: smoke_console
    reason: >-
      this report was hand-assembled from the repository's own example files;
      no smoke run produced a console. A real run carries one.


# WHAT THE TOOL REFUSES, each enforced by code rather than by intent. This one
# CAN transmit — that is what --submit is — so the refusals say what bounds
# the transmission rather than pretending there is none.
refuses:
  - >-
    send on its own: nothing here transmits until an operator types --submit;
    there is no timer and no hook in this tool
  - >-
    send anywhere else: one destination, and it is the channel host you
    already pull from — report_scope.destination in your own contract
  - >-
    send above your rung: this document is validated against report.v1 and
    against your contract's report_scope before a byte moves
  - >-
    carry a credential: values under keys matching
    password|token|secret|key|apikey are REDACTED, and the finished file is
    scanned for every one removed
  - >-
    carry your content: report.v1 has no field for a transcript, a meeting
    title, a participant or a log line, at any tier


# THE REDACTION SELF-CHECK. `values_redacted` counts the plaintext values that
# were removed from your values file. The finished document is then scanned
# for every one of them; `verified: true` means none survived. A survivor
# exits 3, names the count and never the value, and the file is kept so you
# can inspect it — but it must not be sent.
redaction:
  verified: true
  values_redacted: 3
  leaks: 0
