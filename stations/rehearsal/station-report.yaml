# vexa-validate 0.2.0 — this station, as it actually stands.
#
# WHAT THIS IS. One file: the provider profile, your values with every secret
# removed, the contract this run was judged against, and the preflight and
# smoke receipts — each verbatim, each with the digest of its own text at the
# foot of the document.
#
# ONE FILE, AND THAT IS THE DESIGN. Not a directory, not an archive, nothing
# to extract. You have to read all of it before any of it leaves, and six
# files in a tarball is a review task where one commented document is a read.
#
# WHAT IS NOT IN IT. No credentials: every value under a key matching
# password|token|secret|key|apikey is REDACTED, and the finished file is
# scanned for what was removed. No meeting content, no transcripts, no
# participants, no schema and no rows — report.v1 sets
# additionalProperties:false on every object, so there is nowhere in this
# document to put one.
#
# IT HAS NOT BEEN SENT ANYWHERE. Writing it sends nothing. `--submit` sends
# it, to the channel host you already pull from, with your own credential,
# after checking it against your contract's report_scope. Read it first. That
# is what it is for.

schema_version: 1
bundle_kind: install
station: rehearsal
generated_at: '2026-08-24T09:45:00Z'
generator: >-
  SYNTHETIC — hand-assembled from this repository's own example files,
  rendered by kit/validate/vexa_validate.py's own writer. A real report is
  produced by a run of that tool on a customer's cluster.
kit:
  commit: null
  describe: '0.0.0-synthetic'
  station_chart_version: null
kubernetes:
  server_version: v1.31.0
provider:
  name: openshift
  profile_env_present: true
  profile_tested: 'no'
