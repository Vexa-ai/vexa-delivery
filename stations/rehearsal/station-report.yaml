  target: vexa-rehearsal
  release_prefix: vexa-vexa
tiers:
  flows: false


# THE CONTRACT THIS RUN WAS JUDGED AGAINST — id and sha256. The document
# itself is below under `contract_document`; the sha256 is over that text, so
# the identity can be recomputed from what you can see rather than from a file
# you were told about.
contract:
  source: contract.yaml
  kit_default: false
  contract_id: rehearsal-2026-01
  sha256: '94abcbb29d0ded329d7a91ed458b4558ee8e8a591c49f3a0e596f8b8eef5234d'


# WHAT RAN, AND WHAT IT DECIDED. Verdicts and exit codes. The receipts these
# verdicts came from are below, verbatim — nothing here summarises them.
phases:
  preflight:
    verdict: PASS
    exit_code: 0
    receipt: preflight-receipt.txt
  install:
    skipped: true
    reason: not requested (--install)
  smoke:
    verdict: PASS
    exit_code: 0
    receipt: smoke-receipt.json


# 1 · THE PROVIDER PROFILE this run used, verbatim. Substrate facts: provider,
# Kubernetes version, scope, storage class, PSA mode, mirror host. Never
# credentials. If it says PROFILE_TESTED=no, this is the section worth sending
# back filled in — it is the highest-value part of the contribution.
profile: |
  # SYNTHETIC station profile — rehearsal station, not a customer.
  # Provider/substrate facts the station declares. Never credentials: the ingest
  # secret scan (S4) refuses a bundle that carries any.
  STATION_NAME=rehearsal
  PROVIDER=openshift
  KUBERNETES_VERSION=1.31
  SCOPE=namespace
  NAMESPACE=vexa-rehearsal
  ARGOCD_VERSION=v3.5.1
  KYVERNO_VERSION=v1.19.0
  STORAGE_CLASS=thin-csi
  PSA_ENFORCE=restricted
  LIMITRANGE_PRESENT=yes
  RESOURCEQUOTA_PRESENT=yes
  REGISTRY_MIRROR=harbor.example.invalid/vexa-mirror


# 2 · YOUR VALUES FILE, structurally intact, with every secret-looking value
# replaced by REDACTED — keys matching password|token|secret|key|apikey, and
# everything nested beneath them. THE SHAPE IS THE CONTRIBUTION: what we need
# is which knobs you turned, never what you turned them to. An empty value
# stays empty, because "not set" is configuration and not a secret.
values: |
  # SYNTHETIC — the rehearsal station's customer-local values, redacted for
  # transport. Only the SHAPE travels: every credential is a placeholder, and
  # ingest refuses the bundle if one is not (S4).
  #
  # Derived from kit/profiles/vexa/customer-values.example.yaml plus the two
  # environment facts this station's shape depends on: object storage is the
  # customer's own (in-cluster MinIO off), and every dependency image is pulled
  # from their mirror at a digest.
  secrets:
    existingSecretName: vexa-station-secrets   # pre-created in the namespace
    adminApiToken: REDACTED
    internalApiSecret: REDACTED
    nextauthSecret: REDACTED
  global:
    imagePullPolicy: IfNotPresent
    imagePullSecrets:
      - name: harbor-mirror-pull
    tolerations: []
  migrations:
    enabled: false
  gateway:
    replicaCount: 1
  # Dependencies come from the customer's mirror, pinned by digest — the same
  # rule the delivered images obey (S8).
  postgres:
    image: harbor.example.invalid/vexa-mirror/postgres:17-alpine@sha256:1111111111111111111111111111111111111111111111111111111111111111
  redis:
    image: harbor.example.invalid/vexa-mirror/valkey:8-alpine@sha256:2222222222222222222222222222222222222222222222222222222222222222
  # Object storage is the customer's own S3 endpoint; the bundled MinIO and its
  # init Job (image `minio/mc:latest`, no resources declared) are off.
  minio:
    enabled: false


# 3 · THE CONTRACT, verbatim — the policy this run was produced under, carried
# beside the evidence rather than referenced from it. Its `report_scope` is
# the clause that bounds what may leave this perimeter, and `--submit` checks
# this document against it before a byte moves.
contract_document: |
  # SYNTHETIC — the rehearsal station's contract: what a release must prove
  # before it may run HERE. The customer's file; Vexa can tighten nothing and
  # weaken nothing. Its sha256 is the contract's identity and rides in every
  # gate report.
  contract_id: rehearsal-2026-01

  # Channel-entry half (read by kit/verify — see kit/verify/policy.example.yaml)
  require_vendor_approval: true
  require_publication_mode: published
  require_evidence_kinds:
    - candidate_map
    - delivery_receipt
    - source_provenance
    - trusted_root
  allow_break_glass: false
  min_entry_seq: 1

  # Station half (read by publisher/vexa_station.py gate) — the per-release
  # guarantees this station requires before Vexa may publish to it.
  require:
    - german-teams-meeting-validated
    - images-digest-pinned
    - no-hostpath

  # Delivery scope (read by publisher/vexa_station.py gate) — the blast radius
  # this station permits. PSS/SCC + OLM-shaped vocabulary; see
  # kit/verify/policy.example.yaml for the annotated form.
  delivery_scope:
    allowed_namespaces:
      - vexa-staging
      - vexa-prod
    allow_cluster_scoped: false
    pod_security: baseline
    allowed_image_registries:
      # This station mirrors everything into its own Harbor; Vexa's own images
      # still come from Docker Hub today. Short refs like `vexaai/v012-gateway`
      # are normalised to `docker.io/...` before matching, so the fully-qualified
      # prefix is what belongs here.
      - docker.io/vexaai/
      - harbor.example.invalid/vexa-mirror/
    resource_ceiling:
      cpu: "16"
      memory: 32Gi

  # Report scope (read by kit/validate --submit) — what may leave this estate.
  report_scope:
    schema: report.v1
    trigger: explicit-command-only
    destination: channel.vexa.ai
    # The sections of station-report.yaml this estate permits to leave. The
    # report is ONE file, so the bound is over its named sections rather than
    # over the members of an archive.
    allowed_sections:
      - profile
      - values
      - contract_document
      - preflight_receipt
      - smoke_receipt
      - smoke_console
      - install_log
    require_redaction_verified: true


# 4 · THE PREFLIGHT RECEIPT, verbatim — will this cluster run what the channel
# delivers. Every finding names its own remedy.
