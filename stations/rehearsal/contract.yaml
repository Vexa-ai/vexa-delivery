# SYNTHETIC — the rehearsal station's contract: what a release must prove
# before it may run HERE. The customer's file; Vexa can tighten nothing and
# weaken nothing. Its sha256 is the contract's identity and rides in every
# gate report.
contract_id: rehearsal-2026-01

# Channel-entry half (read by kit/verify — see kit/verify/policy.example.yaml)
require_vendor_approval: true
require_publication_mode: published
require_evidence_kinds:
  - candidate_map
  - delivery_receipt
  - source_provenance
  - trusted_root
allow_break_glass: false
min_entry_seq: 1

# Station half (read by publisher/vexa_station.py gate) — the per-release
# guarantees this station requires before Vexa may publish to it.
require:
  - german-teams-meeting-validated
  - images-digest-pinned
  - no-hostpath

# Delivery scope (read by publisher/vexa_station.py gate) — the blast radius
# this station permits. PSS/SCC + OLM-shaped vocabulary; see
# kit/verify/policy.example.yaml for the annotated form.
delivery_scope:
  allowed_namespaces:
    - vexa-staging
    - vexa-prod
  allow_cluster_scoped: false
  pod_security: baseline
  allowed_image_registries:
    # This station mirrors everything into its own Harbor; Vexa's own images
    # still come from Docker Hub today. Short refs like `vexaai/v012-gateway`
    # are normalised to `docker.io/...` before matching, so the fully-qualified
    # prefix is what belongs here.
    - docker.io/vexaai/
    - harbor.example.invalid/vexa-mirror/
  resource_ceiling:
    cpu: "16"
    memory: 32Gi

# Report scope (read by kit/validate --submit) — what may leave this estate.
report_scope:
  schema: report.v1
  trigger: explicit-command-only
  destination: channel.vexa.ai
  allowed_files:
    - station.json
    - contract.yaml
    - profile.env
    - values.redacted.yaml
    - preflight-receipt.txt
    - smoke-receipt-*.md
    - smoke-receipt.json
    - smoke-console.txt
    - install-log.txt
  require_redaction_verified: true
