# SPDX-License-Identifier: Apache-2.0
#
# vexa-state-report, run FROM INSIDE THE CLUSTER — no `kubectl exec`, and no
# route from your workstation to the database.
#
# Reach for this when either is true, and both are common:
#   * you cannot get `create` on `pods/exec` (it is the most tightly held verb
#     in most regulated estates, and asking for it turns an afternoon into a
#     change ticket);
#   * Postgres is MANAGED or otherwise outside the cluster — which the Vexa
#     chart supports (`postgres.enabled=false`) — so there is no pod to exec
#     into at all, and its private endpoint is not reachable from your laptop.
#
# The Job runs under its own ServiceAccount with the read-only Role below, and
# the bundle comes back through `kubectl logs`. That is deliberate: `kubectl cp`
# is implemented with exec, so retrieving a file that way would reintroduce the
# permission this whole path exists to avoid. Logs need `pods/log`, which is an
# ordinary read.
#
# ─────────────────────────────────────────────────────────────────────────────
# ONE REQUIRED EDIT, and it is stated plainly rather than defaulted to
# something that would fail on apply.
#
# `image:` below must carry BOTH python3 >= 3.9 AND the PostgreSQL client
# (psql, pg_dump). No public image ships both: `postgres:16-bookworm` has the
# client and no python, `python:3.12-slim-bookworm` has python and no client.
# In a regulated estate you are going to substitute your own approved base
# anyway, so pick one of:
#
#   a) your own golden image, with `apt-get install -y postgresql-client python3`
#   b) build the two-line one:
#        FROM postgres:16-bookworm
#        RUN apt-get update && apt-get install -y --no-install-recommends python3 \
#            && rm -rf /var/lib/apt/lists/*
#      then push it wherever your cluster already pulls from
#
# The client's major version should be >= your server's, or pg_dump refuses and
# the tool falls back to its information_schema reconstruction (which it labels
# as such — it is not a dump and must not be restored from).
# ─────────────────────────────────────────────────────────────────────────────
#
# HOW TO RUN IT
#
#  1 · put the tool and its probes in a ConfigMap (this is why the tool is one
#      stdlib-only file — it travels):
#
#      kubectl -n vexa create configmap vexa-state-report \
#        --from-file=vexa_state_report.py=kit/report/vexa_state_report.py \
#        --from-file=v0.12.23.json=kit/report/probes/v0.12.23.json
#
#  2 · point DB_HOST/DB_NAME/DB_USER below at your database, and PGPASSWORD at
#      the Secret that already holds its password (the Vexa chart's default is
#      `postgres-credentials`). The password is never an argument: it reaches
#      psql through the environment only.
#
#  3 · kubectl apply -f kit/report/job.yaml
#      kubectl -n vexa wait --for=condition=complete job/vexa-state-report --timeout=10m
#
#  4 · read what it says, then take the bundle out of the logs:
#
#      kubectl -n vexa logs job/vexa-state-report            # the console: probes, absences, redaction verdict
#      kubectl -n vexa logs job/vexa-state-report \
#        | sed -n '/^---VEXA-STATE-REPORT-BASE64---$/,$p' | tail -n +2 \
#        | base64 -d > state-report.tar.gz
#      tar tzf state-report.tar.gz && tar xzf state-report.tar.gz
#
#  5 · READ THE FILES. Then send them by hand. Nothing here transmits — the Job
#      has no egress to us, writes to an emptyDir, and prints to a log you own.
#
#  6 · kubectl -n vexa delete -f kit/report/job.yaml
#
# NOTE ON THE LOGS: the bundle is a few tens of KB of base64 on one line. Your
# log pipeline will retain it like any other log line, which is one more reason
# to delete the Job when you are done.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vexa-state-report
  namespace: vexa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vexa-state-report
  namespace: vexa
rules:
  # get/list only. No secrets, no configmaps, no logs, no exec, no write verb.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vexa-state-report
  namespace: vexa
subjects:
  - kind: ServiceAccount
    name: vexa-state-report
    namespace: vexa
roleRef:
  kind: Role
  name: vexa-state-report
  apiGroup: rbac.authorization.k8s.io
# Node shapes are cluster-scoped. Uncomment both to collect them; leave them out
# and the node inventory is reported ABSENT with that reason, which is a
# complete answer and not a broken run.
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRole
# metadata:
#   name: vexa-state-report-nodes
# rules:
#   - apiGroups: [""]
#     resources: ["nodes"]
#     verbs: ["get", "list"]
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRoleBinding
# metadata:
#   name: vexa-state-report-nodes
# subjects:
#   - kind: ServiceAccount
#     name: vexa-state-report
#     namespace: vexa
# roleRef:
#   kind: ClusterRole
#   name: vexa-state-report-nodes
#   apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vexa-state-report
  namespace: vexa
spec:
  backoffLimit: 0        # a failed read is a finding to read, not a thing to retry
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      name: vexa-state-report
    spec:
      serviceAccountName: vexa-state-report
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: report
          # ── THE ONE REQUIRED EDIT — see the header ──────────────────────────
          image: REPLACE-ME-python3-and-postgresql-client
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DB_HOST
              value: "postgres.vexa.svc.cluster.local"    # or your managed endpoint
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "vexa"
            - name: DB_USER
              value: "vexa"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials               # your existing Secret
                  key: password
                  optional: true                           # absent -> .pgpass or trust auth
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              # The console goes to stderr so stdout carries exactly one thing:
              # the base64 bundle after its marker. Both land in kubectl logs.
              python3 /kit/vexa_state_report.py \
                --namespace "$NAMESPACE" \
                --db-host "$DB_HOST" --db-port "$DB_PORT" \
                --db-name "$DB_NAME" --db-user "$DB_USER" \
                --probe-set /kit/probes/v0.12.23.json \
                --out /tmp 1>&2 && rc=0 || rc=$?
              # Exit 3 is a redaction leak: the tool kept the bundle for
              # inspection and said it must not be sent. Emitting it into a log
              # your aggregator ships offsite would be exactly the send it just
              # refused, so the bundle does NOT come out this way.
              if [ "$rc" -eq 3 ]; then
                echo "redaction check FAILED — bundle withheld from stdout on purpose." 1>&2
                echo "It is at /tmp/state-report.tar.gz in this pod. Read the console" 1>&2
                echo "above, report the finding to Vexa, and do not send the file." 1>&2
                exit 3
              fi
              echo '---VEXA-STATE-REPORT-BASE64---'
              base64 /tmp/state-report.tar.gz
              exit "$rc"
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "1", memory: "512Mi"}
          volumeMounts:
            - name: tool
              mountPath: /kit/vexa_state_report.py
              subPath: vexa_state_report.py
              readOnly: true
            - name: tool
              mountPath: /kit/probes/v0.12.23.json
              subPath: v0.12.23.json
              readOnly: true
            - name: work
              mountPath: /tmp
      volumes:
        - name: tool
          configMap:
            name: vexa-state-report
        - name: work
          emptyDir: {}
