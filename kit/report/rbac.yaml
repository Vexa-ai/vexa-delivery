# SPDX-License-Identifier: Apache-2.0
#
# vexa-state-report — the exact access it needs, as a file you can hand to the
# team that owns the cluster.
#
# This is written to be forwarded. If your namespace belongs to another team
# and you open a ticket to get access, this file IS the ticket: every verb is
# here, nothing is implied, and the one privileged verb is in its own optional
# block that you can delete.
#
# Replace vexa (namespace) and the subject at the bottom, then apply.
#
#   kubectl apply -f kit/report/rbac.yaml
#
# ── 1 · REQUIRED · the inventory read ────────────────────────────────────────
# Everything except the database half. `get`/`list` only; no watch, no secrets,
# no configmaps, no logs, no write verb anywhere.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vexa-state-report
  namespace: vexa
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]

# ── 2 · OPTIONAL · node shapes ───────────────────────────────────────────────
# Nodes are cluster-scoped, so this cannot be a Role. Skip the whole block and
# the node inventory is reported ABSENT with that reason; nothing else changes,
# and the report is still worth sending. The reproduction environment is then
# sized from your description instead of from your cluster.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vexa-state-report-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]

# ── 3 · OPTIONAL · the --db-pod transport, and read this before you ask ──────
#
# `kubectl exec` is `create` on `pods/exec`. In most regulated estates it is
# the most tightly held verb there is, it is audited, and asking for it turns
# an afternoon into a change ticket. WE DO NOT WANT YOU TO ASK FOR IT.
#
# Two ways to not need it:
#   * `--db-host` — a managed, external or port-forwarded database. No exec, no
#     Kubernetes permission at all on the database side.
#   * `kit/report/job.yaml` — runs the database half from INSIDE the cluster
#     under its own read-only ServiceAccount. No exec, and nothing needs a
#     route from your workstation to Postgres.
#
# If you still want the exec transport, this is the narrowest form of it:
# scoped by `resourceNames` to the single database pod, so it grants a shell in
# that pod and in no other. Delete this block otherwise.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vexa-state-report-dbexec
  namespace: vexa
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["postgres-0"]        # your database pod, exactly
    verbs: ["create"]

# ── 4 · bind them ────────────────────────────────────────────────────────────
# Subject: the human who runs the tool, or a ServiceAccount if you run it from
# a jump box. Replace with your own identity.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vexa-state-report
  namespace: vexa
subjects:
  - kind: User
    name: you@example.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: vexa-state-report
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vexa-state-report-nodes
subjects:
  - kind: User
    name: you@example.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: vexa-state-report-nodes
  apiGroup: rbac.authorization.k8s.io

# ── 5 · the database user ────────────────────────────────────────────────────
# Not Kubernetes. Whichever transport you pick, the database role needs exactly
# this and nothing more:
#
#   CREATE ROLE vexa_report LOGIN PASSWORD '…';
#   GRANT CONNECT ON DATABASE vexa TO vexa_report;
#   GRANT USAGE ON SCHEMA public TO vexa_report;
#   GRANT SELECT ON ALL TABLES IN SCHEMA public TO vexa_report;
#
# The tool opens every session with default_transaction_read_only=on and
# refuses any probe that is not a single SELECT count(...), so a SELECT grant
# is the ceiling and not merely the intent.
