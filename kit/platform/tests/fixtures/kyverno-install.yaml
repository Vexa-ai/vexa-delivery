# SPDX-License-Identifier: Apache-2.0
# FIXTURE — a stand-in for the pinned Kyverno install.yaml (5.8MB, 22 CRDs and
# four controllers). It carries only what the pack's own assertions need: that
# the whole upstream manifest lands in the file verbatim and BEFORE the two
# ClusterPolicies that need its CRD.
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterpolicies.kyverno.io
spec:
  group: kyverno.io
  names: {kind: ClusterPolicy, listKind: ClusterPolicyList, plural: clusterpolicies, singular: clusterpolicy}
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-admission-controller
  namespace: kyverno
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: admission-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/component: admission-controller}
    spec:
      containers:
        - name: kyverno
          image: reg.example/kyverno:fixture
