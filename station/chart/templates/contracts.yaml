# SPDX-License-Identifier: Apache-2.0
{{- /*
THE ENTRY-VERIFICATION CONTRACTS — the machine-readable half of each station's
subscription contract, read by the PreSync verify gate that the SUBSCRIPTION's
Applications carry. The verifier renders every verdict against the contract's
id + sha256, so the file rides byte-exact — never templated.

GATED ON `subscription.enabled`, NOT ON A SWITCH OF THEIR OWN, and the choice
is cohesion: these ConfigMaps have exactly one consumer, the PreSync gate of
the Applications the ApplicationSet above generates. A station with no
subscription generates no Applications, runs no PreSync gate, and these two
objects would sit in the argocd namespace forever with nothing reading them —
a second switch would only let an operator produce that state on purpose.
One concept, one gate: *this station follows this channel and verifies its
entries.*

NOT THE SENDER'S CONTRACT, and the two were conflated until 1.0.6. These carry
`policy.json` — publication mode, required evidence kinds, required
attestations — into the ARGOCD namespace. The receipt sender reads a different
document entirely: the station's own report contract, carrying `report_scope`
(tier · trigger · destination · allowed_sections), as `contract.yaml` from a
ConfigMap in the station namespace. Same word, two documents, two readers, two
namespaces. See `_receipt-sender.tpl`.
*/}}
{{- if .Values.subscription.enabled }}
{{- /*
THE CONTRACT IS AN INPUT, NOT A FILE IN THE VENDOR'S REPOSITORY (2026-08-29).
`files/contracts/` is EMPTY in the source tree; it is filled at packaging time
by `vexa_channel.py station-chart --contract <slot>=<record>`, which copies the
BYTES of the record in the vexa-stations ledger and pins each by sha256 in its
receipt. This repository carries schemas and examples; instances are records and
live with the records.

It used to carry an embedded `internal-prod.json`, and both ledger records say
that copy must not bind an estate. Nothing enforced it. So the render FAILS here
rather than falling back: an empty `.Files.Get` would otherwise produce a
ConfigMap with an EMPTY `policy.json`, and a verifier handed an empty policy
checks nothing while printing OK for every check it never ran.
*/}}
{{- $staging := .Files.Get "files/contracts/staging.json" }}
{{- $prod := .Files.Get "files/contracts/prod.json" }}
{{- if not $staging }}
{{- fail "no staging entry contract was injected into this chart (files/contracts/staging.json is absent or empty). The contract is a PUBLISH INPUT taken from the stations ledger: package with `python3 publisher/vexa_channel.py station-chart --contract staging=<ledger>/channels/<channel>/contracts/<record>.json`. A station that follows no channel sets subscription.enabled=false." }}
{{- end }}
{{- if not $prod }}
{{- fail "no prod entry contract was injected into this chart (files/contracts/prod.json is absent or empty). The contract is a PUBLISH INPUT taken from the stations ledger: package with `python3 publisher/vexa_channel.py station-chart --contract prod=<ledger>/channels/<channel>/contracts/<record>.json`. A station that follows no channel sets subscription.enabled=false." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: vexa-contract-staging
  namespace: {{ .Values.argocdNamespace }}
data:
  policy.json: |-
{{ $staging | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vexa-contract-prod
  namespace: {{ .Values.argocdNamespace }}
data:
  policy.json: |-
{{ $prod | indent 4 }}
{{- end }}
