{{- /* job-migrations.yaml:45 — off in the node baseline, rendered here because a
       customer who turns it on must still get a pinned image. */}}
apiVersion: batch/v1
kind: Job
metadata: {name: migrations}
spec:
  template:
    metadata: {labels: {app: migrations}}
    spec:
      containers:
        - name: migrations
          image: "{{ default .Values.meetingApi.image.repository .Values.migrations.image.repository }}:{{ .Values.global.imageTag | default (default .Values.meetingApi.image.tag .Values.migrations.image.tag) }}"
---
{{- /* deployment-runtime.yaml:37, plus :59-64 — the runtime does not just RUN an
       image, it SPAWNS three more by name. An unpinned value here is a mutable
       tag resolved on a customer's node at dispatch time, which is the same
       defect one level down. */}}
apiVersion: apps/v1
kind: Deployment
metadata: {name: runtime}
spec:
  selector: {matchLabels: {app: runtime}}
  template:
    metadata: {labels: {app: runtime}}
    spec:
      containers:
        - name: runtime
          image: "{{ .Values.runtime.image.repository }}:{{ .Values.global.imageTag | default .Values.runtime.image.tag }}"
          env:
            - name: BROWSER_IMAGE
              value: {{ include "vexa.botImage" . | quote }}
            - name: AGENT_IMAGE
              value: {{ include "vexa.agentImage" . | quote }}
            - name: AGENT_WORKER_IMAGE
              value: {{ include "vexa.agentWorkerImage" . | quote }}
{{- if .Values.flows.enabled }}
---
{{- /* flows.yaml:35-133 — flows-worker. The ensure-db initContainer renders only
       when the flows tables live in a database of their own, which is the
       default; flows.yaml:50 guards it with this exact condition. */}}
apiVersion: apps/v1
kind: Deployment
metadata: {name: flows-worker}
spec:
  replicas: {{ .Values.flows.workerReplicas }}
  selector: {matchLabels: {app: flows-worker}}
  template:
    metadata: {labels: {app: flows-worker}}
    spec:
      {{- if ne .Values.flows.databaseName .Values.database.name }}
      initContainers:
        - name: ensure-db
          image: {{ include "vexa.flowsImage" . | quote }}
      {{- end }}
      containers:
        - name: flows-worker
          image: {{ include "vexa.flowsImage" . | quote }}
---
