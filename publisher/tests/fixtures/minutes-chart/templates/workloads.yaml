{{/*
Every image reference the minutes chart renders, and NOTHING else.

Each `image:` line below is copied character-for-character from Vexa-ai/vexa,
branch minutes-mcp-viewer @ 33379e2c4 — the file and line it came from is named
above it. The pod specs around them are stripped to the bone on purpose: probes,
env, volumes, resources and affinity have no bearing on which bytes a node
pulls, and reproducing them would make this fixture drift on every unrelated
chart change while testing nothing extra.

WHAT IS DELIBERATELY ABSENT. The three third-party tiers (postgres, redis,
pgbouncer), minio and its mc bucket-init Job, and the 0.10-lane dashboard are
not here: they are pinned by kit/profiles/vexa/node-baseline.yaml, not by
build_pins, and a station gate reads them from the baseline overlay. This
fixture is the publisher's own surface — the images a release's candidate map
is supposed to pin.
*/}}
{{- /* deployment-gateway.yaml:33 */}}
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.global.imageTag | default .Values.gateway.image.tag }}"
---
