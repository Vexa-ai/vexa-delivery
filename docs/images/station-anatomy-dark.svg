<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="24" y="60" width="200" height="220" rx="14" fill="#221b3a" stroke="#3f3663"/><text x="124" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#c4b5fd">Vexa channel</text><text x="124" y="112" text-anchor="middle" font-size="11" fill="#94a3b8">private, signed</text><rect x="40" y="146" width="168" height="26" rx="8" fill="#161a24" stroke="#3f3663"/><text x="124" y="163" text-anchor="middle" font-size="10.5" fill="#e5e7eb">releases — frozen digests</text><rect x="40" y="182" width="168" height="26" rx="8" fill="#161a24" stroke="#3f3663"/><text x="124" y="199" text-anchor="middle" font-size="10.5" fill="#e5e7eb">evidence + attestations</text><rect x="40" y="218" width="168" height="26" rx="8" fill="#161a24" stroke="#3f3663"/><text x="124" y="235" text-anchor="middle" font-size="10.5" fill="#e5e7eb">station bundle (machinery)</text><rect x="292" y="28" width="544" height="326" rx="16" fill="#131720" stroke="#64748b" stroke-dasharray="7 5"/><text x="564" y="54" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.5" fill="#7a8698">YOUR CLUSTER · YOUR NAMESPACE</text><rect x="320" y="76" width="488" height="112" rx="12" fill="#161a24" stroke="#3f3663" stroke-width="1.5"/><text x="336" y="102" font-size="14" font-weight="700" fill="#e5e7eb">Station machinery</text><text x="336" y="120" font-size="11" fill="#94a3b8">receives Vexa — installed once by your bootstrap commit</text><rect x="336" y="136" width="88" height="22" rx="11" fill="#1a1f2b" stroke="#2b3446"/><text x="380" y="151" font-size="10.5" text-anchor="middle" fill="#94a3b8">subscription</text><rect x="432" y="136" width="94" height="22" rx="11" fill="#1a1f2b" stroke="#2b3446"/><text x="479" y="151" font-size="10.5" text-anchor="middle" fill="#94a3b8">your contract</text><rect x="534" y="136" width="71" height="22" rx="11" fill="#1a1f2b" stroke="#2b3446"/><text x="569" y="151" font-size="10.5" text-anchor="middle" fill="#94a3b8">admission</text><rect x="613" y="136" width="82" height="22" rx="11" fill="#1a1f2b" stroke="#2b3446"/><text x="654" y="151" font-size="10.5" text-anchor="middle" fill="#94a3b8">floor check</text><rect x="320" y="238" width="488" height="92" rx="12" fill="#161a24" stroke="#334155" stroke-width="1.5"/><text x="336" y="264" font-size="14" font-weight="700" fill="#e5e7eb">Vexa</text><text x="336" y="282" font-size="11" fill="#94a3b8">running release — byte-identical to what the evidence describes</text><rect x="336" y="296" width="60" height="22" rx="11" fill="#1a1f2b" stroke="#2b3446"/><text x="366" y="311" font-size="10.5" text-anchor="middle" fill="#94a3b8">gateway</text><rect x="404" y="296" width="43" height="22" rx="11" fill="#1a1f2b" stroke="#2b3446"/><text x="425" y="311" font-size="10.5" text-anchor="middle" fill="#94a3b8">APIs</text><rect x="454" y="296" width="71" height="22" rx="11" fill="#1a1f2b" stroke="#2b3446"/><text x="490" y="311" font-size="10.5" text-anchor="middle" fill="#94a3b8">dashboard</text><rect x="533" y="296" width="88" height="22" rx="11" fill="#1a1f2b" stroke="#2b3446"/><text x="577" y="311" font-size="10.5" text-anchor="middle" fill="#94a3b8">meeting bots</text><path d="M224,132 C262,132 268,132 306,132" fill="none" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#a1)"/><text x="265" y="118" text-anchor="middle" font-size="10.5" font-weight="600" fill="#c4b5fd">pulls</text><text x="428" y="212" font-size="11" fill="#94a3b8">only what passes <tspan font-weight="600" fill="#c4b5fd">your contract</tspan> — verified here, rolled out automatically</text><path d="M396,188 L396,224" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a2)"/><defs><marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#a78bfa"/></marker><marker id="a2" markerWidth="