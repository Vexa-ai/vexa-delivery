<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The delivery loop: publish, gate, channel, pull, admission, smoke, station bundle, and back to the gate">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D9373"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a94a6"/>
    </marker>
    <style>
      .box  { fill: #ffffff; stroke: #0D9373; stroke-width: 1.5; rx: 8; }
      .num  { fill: #0D9373; font-size: 12px; font-weight: 700; }
      .ttl  { fill: #111827; font-size: 14px; font-weight: 600; }
      .sub  { fill: #4b5563; font-size: 12px; }
      .lane { fill: #6b7280; font-size: 12px; font-weight: 600; letter-spacing: .04em; }
      .lbl  { fill: #6b7280; font-size: 11.5px; font-style: italic; }
      .flow { stroke: #0D9373; stroke-width: 1.6; fill: none; }
      .back { stroke: #8a94a6; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
      .rule { stroke: #e5e7eb; stroke-width: 1; }
    </style>
  </defs>

  <text class="lane" x="20" y="28">VEXA — PUBLISHER SIDE</text>
  <line class="rule" x1="20" y1="40" x2="920" y2="40"/>

  <rect class="box" x="20"  y="58" width="200" height="66"/>
  <text class="num" x="36" y="82">1</text><text class="ttl" x="52" y="82">Publish</text>
  <text class="sub" x="36" y="102">images frozen and signed,</text>
  <text class="sub" x="36" y="117">evidence attached</text>

  <rect class="box" x="270" y="58" width="220" height="66"/>
  <text class="num" x="286" y="82">2</text><text class="ttl" x="302" y="82">Gate</text>
  <text class="sub" x="286" y="102">rendered with your values,</text>
  <text class="sub" x="286" y="117">against your contract</text>

  <rect class="box" x="540" y="58" width="200" height="66"/>
  <text class="num" x="556" y="82">3</text><text class="ttl" x="572" y="82">Channel</text>
  <text class="sub" x="556" y="102">the gated entry lands,</text>
  <text class="sub" x="556" y="117"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">current</tspan> moves</text>

  <path class="flow" d="M220 91 H262"  marker-end="url(#a)"/>
  <path class="flow" d="M490 91 H532"  marker-end="url(#a)"/>
  <path class="flow" d="M640 124 V196" marker-end="url(#a)"/>
  <text class="lbl" x="652" y="166">pull only — nothing reaches in</text>

  <text class="lane" x="20" y="222">YOUR CLUSTER</text>
  <line class="rule" x1="20" y1="234" x2="920" y2="234"/>

  <rect class="box" x="20"  y="252" width="200" height="66"/>
  <text class="num" x="36" y="276">4</text><text class="ttl" x="52" y="276">Pull</text>
  <text class="sub" x="36" y="296">your Argo CD, your</text>
  <text class="sub" x="36" y="311">pull-only credential</text>

  <rect class="box" x="250" y="252" width="200" height="66"/>
  <text class="num" x="266" y="276">5</text><text class="ttl" x="282" y="276">Admission</text>
  <text class="sub" x="266" y="296">Kyverno checks the</text>
  <text class="sub" x="266" y="311">signature, digest-pinned only</text>

  <rect class="box" x="480" y="252" width="200" height="66"/>
  <text class="num" x="496" y="276">6</text><text class="ttl" x="512" y="276">Smoke</text>
  <text class="sub" x="496" y="296">a human, a real meeting,</text>
  <text class="sub" x="496" y="311">a dated receipt</text>

  <rect class="box" x="710" y="252" width="210" height="66"/>
  <text class="num" x="726" y="276">7</text><text class="ttl" x="742" y="276">Station bundle</text>
  <text class="sub" x="726" y="296">receipts, redacted values,</text>
  <text class="sub" x="726" y="311">profile, contract</text>

  <path class="flow" d="M220 285 H242" marker-end="url(#a)"/>
  <path class="flow" d="M450 285 H472" marker-end="url(#a)"/>
  <path class="flow" d="M680 285 H702" marker-end="url(#a)"/>

  <path class="back" d="M815 318 V360 H380 V124" marker-end="url(#b)"/>
  <text class="lbl" x="392" y="352">8 · you send it back by hand — it is the station the next release is gated against</text>
</svg>
