<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Dev, contract validation, channel. Your cluster pulls with Argo CD, verifies the contract, deploys to staging, a human validates and promotes, production deploys. Optional receipts return.">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D9373"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a94a6"/>
    </marker>
    <style>
      .box  { fill: #ffffff; stroke: #0D9373; stroke-width: 1.5; rx: 8; }
      .key  { fill: #f0faf6; stroke: #0D9373; stroke-width: 2.5; rx: 8; }
      .ttl  { fill: #111827; font-size: 14px; font-weight: 600; }
      .sub  { fill: #4b5563; font-size: 11.5px; }
      .lane { fill: #6b7280; font-size: 12px; font-weight: 700; letter-spacing: .06em; }
      .lbl  { fill: #6b7280; font-size: 11.5px; font-style: italic; }
      .flow { stroke: #0D9373; stroke-width: 1.6; fill: none; }
      .back { stroke: #8a94a6; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .div  { stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 3 5; }
    </style>
  </defs>

  <line class="div" x1="460" y1="14" x2="460" y2="452"/>
  <text class="lane" x="30"  y="32">VEXA</text>
  <text class="lane" x="560" y="32">YOUR CLUSTER</text>

  <rect class="box" x="30" y="55" width="260" height="64"/>
  <text class="ttl" x="50" y="81">Dev</text>
  <text class="sub" x="50" y="100">a release is built, images frozen</text>
  <text class="sub" x="50" y="114">and signed</text>

  <rect class="box" x="30" y="155" width="260" height="64"/>
  <text class="ttl" x="50" y="181">Contract validation</text>
  <text class="sub" x="50" y="200">rendered with your values, checked</text>
  <text class="sub" x="50" y="214">against your contract</text>

  <rect class="key" x="30" y="255" width="260" height="64"/>
  <text class="ttl" x="50" y="281">Channel</text>
  <text class="sub" x="50" y="300">the validated entry lands</text>

  <path class="flow" d="M160 119 V149" marker-end="url(#g)"/>
  <path class="flow" d="M160 219 V249" marker-end="url(#g)"/>

  <rect class="box" x="560" y="55" width="310" height="58"/>
  <text class="ttl" x="580" y="79">Argo CD</text>
  <text class="sub" x="580" y="98">pulls, on your schedule</text>

  <rect class="box" x="560" y="135" width="310" height="58"/>
  <text class="ttl" x="580" y="159">Contract verify</text>
  <text class="sub" x="580" y="178">signature and digests checked inside your cluster</text>

  <rect class="box" x="560" y="215" width="310" height="58"/>
  <text class="ttl" x="580" y="239">Staging deploy</text>
  <text class="sub" x="580" y="258">automatic</text>

  <rect class="box" x="560" y="295" width="310" height="58"/>
  <text class="ttl" x="580" y="319">A human validates</text>
  <text class="sub" x="580" y="338">you check it, then promote</text>

  <rect class="box" x="560" y="375" width="310" height="58"/>
  <text class="ttl" x="580" y="399">Prod deploy</text>
  <text class="sub" x="580" y="418">on your attestation</text>

  <path class="flow" d="M715 113 V131" marker-end="url(#g)"/>
  <path class="flow" d="M715 193 V211" marker-end="url(#g)"/>
  <path class="flow" d="M715 273 V291" marker-end="url(#g)"/>
  <path class="flow" d="M715 353 V371" marker-end="url(#g)"/>

  <path class="flow" d="M560 84 H505 V287 H296" marker-end="url(#g)"/>
  <text class="lbl" x="305" y="279">pull — nothing is pushed</text>

  <path class="back" d="M560 404 H345 V340 H165 V325" marker-end="url(#s)"/>
  <text class="lbl" x="352" y="398">optional receipts — so we know it worked</text>
</svg>
