="22" rx="11" fill="#f8fafc" stroke="#e2e8f0"/><text x="569" y="151" font-size="10.5" text-anchor="middle" fill="#64748b">admission</text><rect x="613" y="136" width="82" height="22" rx="11" fill="#f8fafc" stroke="#e2e8f0"/><text x="654" y="151" font-size="10.5" text-anchor="middle" fill="#64748b">floor check</text><rect x="320" y="238" width="488" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="336" y="264" font-size="14" font-weight="700" fill="#0f172a">Vexa</text><text x="336" y="282" font-size="11" fill="#64748b">running release — byte-identical to what the evidence describes</text><rect x="336" y="296" width="60" height="22" rx="11" fill="#f8fafc" stroke="#e2e8f0"/><text x="366" y="311" font-size="10.5" text-anchor="middle" fill="#64748b">gateway</text><rect x="404" y="296" width="43" height="22" rx="11" fill="#f8fafc" stroke="#e2e8f0"/><text x="425" y="311" font-size="10.5" text-anchor="middle" fill="#64748b">APIs</text><rect x="454" y="296" width="71" height="22" rx="11" fill="#f8fafc" stroke="#e2e8f0"/><text x="490" y="311" font-size="10.5" text-anchor="middle" fill="#64748b">dashboard</text><rect x="533" y="296" width="88" height="22" rx="11" fill="#f8fafc" stroke="#e2e8f0"/><text x="577" y="311" font-size="10.5" text-anchor="middle" fill="#64748b">meeting bots</text><path d="M224,132 C262,132 268,132 306,132" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#a1)"/><text x="265" y="118" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6d28d9">pulls</text><text x="428" y="212" font-size="11" fill="#64748b">only what passes <tspan font-weight="600" fill="#6d28d9">your contract</tspan> — verified here, rolled out automatically</text><path d="M396,188 L396,224" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#a2)"/><defs><marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#7c3aed"/></marker><marker id="a2" markerWidth="