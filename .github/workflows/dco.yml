name: dco

# Every commit in a pull request must carry a Signed-off-by: line (Developer
# Certificate of Origin — see CONTRIBUTING.md). A workflow rather than the DCO
# GitHub App: needs no org admin, and the check's logic is visible in-repo.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while read -r sha; do
            # Merge commits are not authored content; skip them.
            if [ "$(git rev-list --no-walk --count --merges "$sha")" = "1" ]; then
              continue
            fi
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha lacks a Signed-off-by line"
              git log -1 --format='  %h %s' "$sha"
              missing=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          if [ "$missing" = "1" ]; then
            echo ""
            echo "Fix: git rebase --signoff $BASE_SHA and force-push."
            exit 1
          fi
          echo "all commits signed off"
